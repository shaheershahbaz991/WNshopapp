<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>WrapNation</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--or:#ff7800;--ordk:#e56500;--tint:#fff3e8;--bg:#fff;--card:#fff;--ink:#2a1a0e;--mute:#8a7566;--line:#ffe2cc;--gain:#16834a;--loss:#d1342b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--or)}
header .logo{height:34px;width:auto;display:block}
header b{font-size:20px;font-weight:800;display:block;line-height:1.1}
header span{font-size:12px;color:var(--mute);font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:6}
main{max-width:520px;margin:0 auto;padding:16px 14px 20px}
.seg{display:flex;gap:4px;padding:4px;background:var(--tint);border-radius:16px;margin-bottom:6px}
.seg button{flex:1;padding:12px;border:0;background:transparent;color:var(--ordk);font:inherit;font-weight:800;border-radius:12px;cursor:pointer;transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--or);color:var(--on);box-shadow:0 4px 12px rgba(255,120,0,.35)}
.seg.e button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(42,26,14,.3)}
label{display:block;font-size:13px;color:var(--mute);font-weight:700;margin:14px 0 5px 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--tint);border:2px solid transparent;border-radius:14px;padding:13px 14px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--or) 50%),linear-gradient(135deg,var(--or) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
input:focus,select:focus{outline:0;border-color:var(--or);background-color:#fff}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
#a{font-size:34px;font-weight:800;text-align:center;padding:16px;color:var(--ordk)}
.save{width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#ff8f2e,var(--or));color:var(--on);font:inherit;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 8px 20px rgba(255,120,0,.35)}
.save:active{transform:scale(.98)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:16px;box-shadow:0 6px 20px rgba(255,120,0,.07)}
.card h3{margin:0 0 8px;font-size:15px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;font-weight:700}.row .t small{display:block;color:var(--mute);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g{color:var(--gain)}.r{color:var(--loss)}
.x{border:0;background:var(--tint);color:var(--ordk);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.pb{background:var(--tint);border-radius:20px;padding:8px;margin-bottom:2px}
.pb .tabs{display:flex;gap:4px;background:#fff;border-radius:14px;padding:4px}
.tabs button{flex:1;padding:9px;border:0;border-radius:11px;background:transparent;color:var(--mute);font:inherit;font-weight:800;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--or);color:var(--on)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
.nav button{border:0;background:#fff;color:var(--or);border-radius:12px;width:44px;height:40px;font-size:22px;font-weight:800;cursor:pointer}
.nav .lab{flex:1;text-align:center;font-weight:800}
.hero{text-align:center;padding:24px 14px;border-radius:24px;margin-top:14px;color:#fff;background:radial-gradient(circle at 92% 0%,rgba(255,255,255,.3),transparent 45%),linear-gradient(135deg,#ff9a3d,#ff7800)}
.hero:has(.r){background:radial-gradient(circle at 92% 0%,rgba(255,255,255,.2),transparent 45%),linear-gradient(135deg,#d9531e,#a8321a)}
.hero small{color:rgba(255,255,255,.9);font-weight:700;font-size:15px}
.hero .n{font-size:42px;font-weight:800;line-height:1.1;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--or);border-radius:16px;padding:12px}
.two small{color:var(--mute);font-weight:700;display:block;font-size:13px}.two b{font-size:19px}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--or),#ffb066);margin-top:4px}
.bar.e{background:linear-gradient(90deg,var(--ink),#6b5444)}
.empty{color:var(--mute);text-align:center;padding:22px 8px;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:0;font-size:15px}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1;padding:14px;border-radius:14px;border:2px solid var(--or);background:#fff;color:var(--ordk);font:inherit;font-weight:800;cursor:pointer}
.btns button.p{background:var(--or);color:var(--on)}
.bn{position:fixed;left:12px;right:12px;max-width:496px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:7;background:#fff;border:1px solid var(--line);border-radius:24px;display:flex;padding:6px;box-shadow:0 10px 30px rgba(120,60,0,.18)}
.bn button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;font-weight:800;padding:8px 2px;cursor:pointer;border-radius:18px}
.bn button[aria-pressed="true"]{color:var(--on);background:var(--or)}
.bn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;display:none;z-index:9}
.hide{display:none}
@media print{header,.bn,.btns,#pb,.toast,body::before{display:none!important}body{padding:0}}
</style>
</head>

<script>
var KEY="wrapnation-v1",E=[],S={cur:"PKR"},V="add",P="d",T="s",M="cash",A=today();
var CATS={s:["Phone accessories","Phone skins","Online","Other sales"],e:["Stock purchase","Rent","Salary","Bills","Packaging","Other"]};
function $(i){return document.getElementById(i)}
function today(){return iso(new Date())}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function add(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function mon(s){return add(s,-((pd(s).getDay()+6)%7))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return S.cur+" "+(n<0?"\u2212":"")+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2})}
function dl(s,o){return pd(s).toLocaleDateString(undefined,o)}
function load(){try{var v=JSON.parse(localStorage.getItem(KEY));if(v){E=Array.isArray(v.e)?v.e:[];if(v.cur&&v.cur!=="SAR")S.cur=v.cur}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({e:E,cur:S.cur}))}catch(e){}}
function toast(t){var x=$("toast");x.textContent=t;x.style.display="block";setTimeout(function(){x.style.display="none"},1800)}

function range(){
 if(P==="d")return[A,A];
 if(P==="w"){var m=mon(A);return[m,add(m,6)]}
 var d=pd(A);return[iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))]}
function label(){var r=range();
 if(P==="d")return dl(A,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
 if(P==="w")return dl(r[0],{day:"numeric",month:"short"})+" \u2013 "+dl(r[1],{day:"numeric",month:"short",year:"numeric"});
 return dl(A,{month:"long",year:"numeric"})}
function shift(n){if(P==="d")A=add(A,n);else if(P==="w")A=add(A,7*n);else{var d=pd(A);A=iso(new Date(d.getFullYear(),d.getMonth()+n,1))}}
function inR(){var r=range();return E.filter(function(e){return e.d>=r[0]&&e.d<=r[1]})}
function tot(l){var s=0,x=0,k=0,cs=0,cc=0,st=0;l.forEach(function(e){if(e.t==="s"){s+=e.a;if(e.m==="card")k+=e.a;if(typeof e.q==="number"){cs+=e.a;cc+=e.q}}else{x+=e.a;if(e.c==="Stock purchase")st+=e.a}});return{s:s,x:x,p:s-x,k:k,h:s-k,cs:cs,cc:cc,st:st}}
function costCard(t){if(!t.cs)return"";var g=t.cs-t.cc,o=t.x-t.st,R=function(a,b,c){return '<div class="row"><span class="t">'+a+'</span><b'+(c?' class="'+c+'"':'')+'>'+b+'</b></div>'};
 return '<div class="card"><h3>Profit using cost price</h3>'+R("Sales with cost price",fmt(t.cs))+R("Their cost",fmt(t.cc))+R("Gross profit ("+(g/t.cs*100).toFixed(1)+"%)",fmt(g),g<0?"r":"g")+R("Other expenses (without Stock purchase)",fmt(o))+R("Net profit",fmt(g-o),g-o<0?"r":"g")+(t.s>t.cs?'<p class="empty" style="padding:8px 0 0">Sales without a cost price ('+fmt(t.s-t.cs)+') are not counted above.</p>':'')+'<p class="empty" style="padding:8px 0 0">For the same goods, use either cost price or Stock purchase, not both.</p></div>'}
function by(l,t){var g={};l.forEach(function(e){if(e.t===t)g[e.c]=(g[e.c]||0)+e.a});
 return Object.keys(g).map(function(k){return[k,g[k]]}).sort(function(a,b){return b[1]-a[1]})}
function bars(l,t,title){var b=by(l,t);if(!b.length)return"";var mx=b[0][1];
 return '<div class="card"><h3>'+title+'</h3>'+b.map(function(x){return '<div style="margin-top:8px"><div class="row" style="border:0;padding:0"><span class="t">'+esc(x[0])+'</span><b>'+fmt(x[1])+'</b></div><div class="bar'+(t==="e"?" e":"")+'" style="width:'+Math.max(4,Math.round(x[1]/mx*100))+'%"></div></div>'}).join("")+"</div>"}

function setCats(){$("c").innerHTML=CATS[T].map(function(c){return "<option>"+c+"</option>"}).join("")}
function renderAdd(){
 [].forEach.call($("seg").children,function(b){b.setAttribute("aria-pressed",b.dataset.t===T)});
 $("seg").className="seg"+(T==="e"?" e":"");
 $("pw").className=T==="s"?"":"hide";$("cw").className=T==="s"?"":"hide";[].forEach.call($("pseg").children,function(b){b.setAttribute("aria-pressed",b.dataset.m===M)});
 var d=$("d").value||today(),l=E.filter(function(e){return e.d===d}),t=tot(l);
 var h='<h3>'+dl(d,{day:"numeric",month:"short"})+": sales "+fmt(t.s)+", expenses "+fmt(t.x)+", "+(t.p<0?"loss ":"profit ")+'<span class="'+(t.p<0?"r":"g")+'">'+fmt(Math.abs(t.p))+"</span></h3>";
 if(!l.length)h+='<div class="empty">No entries for this date yet.</div>';
 l.slice().reverse().forEach(function(e){h+='<div class="row"><div class="t">'+esc(e.c)+(e.t==="s"?" ("+(e.m==="card"?"Card":"Cash")+")":"")+((e.n||typeof e.q==="number")?"<small>"+esc(e.n||"")+(typeof e.q==="number"?(e.n?" \u00b7 ":"")+"Cost "+fmt(e.q)+", profit "+fmt(e.a-e.q):"")+"</small>":"")+'</div><b class="'+(e.t==="s"?"g":"r")+'">'+(e.t==="s"?"+":"\u2212")+fmt(e.a).replace(S.cur+" ","")+'</b><button class="x" data-del="'+e.id+'" aria-label="Delete entry">Delete</button></div>'});
 $("dl").innerHTML=h}
function renderSum(){
 var l=inR(),t=tot(l);
 if(!l.length){$("v-sum").innerHTML='<div class="empty">No entries in this period.<br>Go to Add to record sales and expenses.</div>';return}
 var h='<div class="hero"><small>'+(t.p<0?"Loss":"Profit")+'</small><div class="n '+(t.p<0?"r":"g")+'">'+fmt(Math.abs(t.p))+'</div></div>'
 +'<div class="two"><div><small>Sales</small><b class="g">'+fmt(t.s)+'</b></div><div><small>Expenses</small><b class="r">'+fmt(t.x)+'</b></div></div>'
 +'<div class="two"><div><small>Cash sales</small><b>'+fmt(t.h)+'</b></div><div><small>Card sales</small><b>'+fmt(t.k)+'</b></div></div>'+costCard(t)
 +bars(l,"e","Where the money went")+bars(l,"s","What sold");
 if(P!=="d"){var r=range(),rows="";
  for(var d=r[0];d<=r[1];d=add(d,1)){var q=tot(l.filter(function(e){return e.d===d}));
   if(q.s||q.x)rows+='<div class="row"><span class="t">'+dl(d,{weekday:"short",day:"numeric",month:"short"})+'<small>Sales '+fmt(q.s)+" \u00b7 Expenses "+fmt(q.x)+'</small></span><b class="'+(q.p<0?"r":"g")+'">'+fmt(q.p)+"</b></div>"}
  h+='<div class="card"><h3>Day by day</h3>'+rows+"</div>"}
 $("v-sum").innerHTML=h}
function reportText(){
 var l=inR(),t=tot(l),r=range(),o=["WrapNation \u2013 "+(P==="d"?"Daily":P==="w"?"Weekly":"Monthly")+" Report",label(),"",
  "Sales: "+fmt(t.s),"  Cash: "+fmt(t.h),"  Card: "+fmt(t.k),"Expenses: "+fmt(t.x),(t.p<0?"LOSS: ":"PROFIT: ")+fmt(Math.abs(t.p))];
 if(t.cs){var g=t.cs-t.cc;o.push("","Using cost price","Gross profit: "+fmt(g)+" ("+(g/t.cs*100).toFixed(1)+"%)","Net after other expenses: "+fmt(g-(t.x-t.st)))}
 if(P==="d"){["s","e"].forEach(function(k){var x=l.filter(function(e){return e.t===k});
  if(x.length){o.push("",k==="s"?"Sales":"Expenses");x.forEach(function(e){o.push("- "+e.c+(e.n?" ("+e.n+")":"")+": "+fmt(e.a))})}})}
 else{o.push("","Day by day");for(var d=r[0];d<=r[1];d=add(d,1)){var q=tot(l.filter(function(e){return e.d===d}));
  if(q.s||q.x)o.push(dl(d,{day:"numeric",month:"short"})+": sales "+fmt(q.s)+", expenses "+fmt(q.x)+", net "+fmt(q.p))}
  by(l,"e").forEach(function(x,i){if(!i)o.push("","Expenses by category");o.push("- "+x[0]+": "+fmt(x[1]))})}
 return o.join("\n")}
function renderRep(){
 $("v-rep").innerHTML=inR().length?'<div class="card" id="repcard"><pre id="rt">'+esc(reportText())+'</pre></div><div class="btns"><button id="cp">Copy report</button><button class="p" id="pr">Print / PDF</button></div><p class="empty">Copy and paste the report into WhatsApp.</p>':'<div class="empty">No entries in this period, so there is no report yet.</div>'}
function render(){
 [].forEach.call(document.querySelectorAll(".bn button"),function(b){b.setAttribute("aria-pressed",b.dataset.v===V)});
 ["add","sum","rep"].forEach(function(v){$("v-"+v).className=v===V?"":"hide"});
 $("pb").className="pb"+(V==="add"?" hide":"");
 [].forEach.call(document.querySelectorAll("[data-p]"),function(b){b.setAttribute("aria-pressed",b.dataset.p===P)});
 $("lab").textContent=label();
 if(V==="add")renderAdd();else if(V==="sum")renderSum();else renderRep()}

document.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
 if(b.dataset.v){V=b.dataset.v;window.scrollTo(0,0)}
 else if(b.dataset.p)P=b.dataset.p;
 else if(b.dataset.n)shift(+b.dataset.n);
 else if(b.dataset.m){M=b.dataset.m}
 else if(b.dataset.t){T=b.dataset.t;setCats()}
 else if(b.dataset.del){E=E.filter(function(e){return String(e.id)!==b.dataset.del});save()}
 else if(b.id==="save"){var a=parseFloat($("a").value);if(!(a>0)){toast("Enter an amount");$("a").focus();return}
  E.push({id:Date.now(),d:$("d").value||today(),t:T,m:T==="s"?M:"",q:T==="s"&&parseFloat($("cp").value)>=0?parseFloat($("cp").value):null,a:a,c:$("c").value,n:$("n").value.trim()});save();
  $("a").value="";$("n").value="";$("cp").value="";toast(T==="s"?"Sale saved":"Expense saved")}
 else if(b.id==="cp"){var t=$("rt").textContent;
  try{navigator.clipboard.writeText(t).then(function(){toast("Report copied")},function(){sel()})}catch(e){sel()}
  function sel(){var r=document.createRange();r.selectNodeContents($("rt"));var s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Press Copy on your phone.")}return}
 else if(b.id==="pr"){try{window.print()}catch(e){toast("Print is not available here")}return}
 else return;
 render()});
$("d").addEventListener("change",render);
$("cur").addEventListener("input",function(){S.cur=this.value.trim()||"PKR";save()});
load();$("d").value=today();$("cur").value=S.cur;setCats();render();
</script>
